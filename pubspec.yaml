name: depthvibe
description: A cross-platform AI-first video and 3D creative studio by N Tech.
publish_to: none
version: 0.5.0+3

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  archive: ^4.7.1
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  image: ^4.13.1
  flutter_svg: ^2.5.0
  psdkit: ^0.6.3
  file_picker: ^13.4.0
  ffmpeg_kit_extended_flutter: ^1.0.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  path_provider: ^2.1.5
  saver_gallery: ^5.1.0
  permission_handler: ^13.0.2
  device_info_plus: ^13.3.0
  share_plus: ^13.3.1
  cross_file: ^0.3.5+2
  nitro_webgpu: ^0.0.1
  gltfx: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/live_effect_preview.frag
    - shaders/lut_preview.frag

hooks:
  user_defines:
    ffmpeg_kit_extended_flutter:
      type: "full"
      gpl: false
      small: false
