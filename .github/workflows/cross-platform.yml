name: DepthVibe Windows Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/ae-shape-layer-render]
  workflow_dispatch:

concurrency:
  group: depthvibe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  windows:
    name: Windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate Flutter platform runners
        shell: bash
        run: bash tool/bootstrap_platforms.sh
      - name: Pre-vendor WebGPU native library outside the plugin symlink
        shell: pwsh
        run: |
          $packages = Get-Content .dart_tool/package_config.json -Raw | ConvertFrom-Json
          $plugin = $packages.packages | Where-Object { $_.name -eq "nitro_webgpu" }
          if ($null -eq $plugin) { throw "nitro_webgpu package was not resolved." }
          $packageRoot = ([Uri]$plugin.rootUri).LocalPath
          & bash "$packageRoot/scripts/fetch_wgpu_native.sh" --targets windows-x86_64-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Format, analyze and test
        run: |
          dart format lib test
          flutter analyze --no-fatal-infos
          flutter test
      - name: Validate After Effects ScriptUI source syntax and controls
        shell: bash
        run: |
          node --check < integrations/adobe/after-effects-cep/scripts/DepthVibe_Motion_Tools.jsx
          node integrations/adobe/after-effects-cep/scripts/validate_scriptui.js
      - name: Build Windows desktop release
        run: flutter build windows --release
      - name: Verify and package portable Windows application
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $exe = Join-Path $releaseDir "DepthVibe.exe"
          if (!(Test-Path $exe)) { throw "DepthVibe.exe was not generated." }
          if (!(Test-Path (Join-Path $releaseDir "data/flutter_assets"))) {
            throw "Flutter assets are missing from the Windows release."
          }
          if (!(Test-Path (Join-Path $releaseDir "flutter_windows.dll"))) {
            throw "Flutter Windows runtime is missing from the Windows release."
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          @'
          DepthVibe Windows x64
          ---------------------
          Extract this archive to a writable folder.
          Run DepthVibe.exe from this folder.
          Keep all DLL files, data folders and plugin folders beside the executable.
          Do not move DepthVibe.exe out of this folder.
          '@ | Set-Content dist/README.txt
          Compress-Archive -Path "$releaseDir/*",dist/README.txt -DestinationPath dist/DepthVibe-Windows-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash dist/DepthVibe-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -NoNewline dist/DepthVibe-Windows-x64.zip.sha256 "$hash  DepthVibe-Windows-x64.zip"
      - name: Upload portable Windows release only
        uses: actions/upload-artifact@v4
        with:
          name: DepthVibe-Windows-x64
          path: |
            dist/DepthVibe-Windows-x64.zip
            dist/DepthVibe-Windows-x64.zip.sha256
          if-no-files-found: error
