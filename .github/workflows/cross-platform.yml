name: DepthVibe Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  android-linux:
    name: Android APK + Linux + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux desktop and camera dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good
      - name: Generate Flutter platform runners
        run: bash tool/bootstrap_platforms.sh
      - name: Format, analyze and test
        run: |
          dart format lib test
          flutter analyze
          flutter test
      - name: Build Android APKs
        run: flutter build apk --release --split-per-abi
      - name: Build Linux desktop
        run: flutter build linux --release
      - name: Upload Android and Linux builds
        uses: actions/upload-artifact@v4
        with:
          name: DepthVibe-Android-Linux
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/linux/x64/release/bundle/
          if-no-files-found: error

  windows:
    name: Windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate Flutter platform runners
        shell: bash
        run: bash tool/bootstrap_platforms.sh
      - run: flutter analyze
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: DepthVibe-Windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  apple:
    name: macOS and iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate Flutter platform runners
        run: bash tool/bootstrap_platforms.sh
      - run: flutter analyze
      - name: Build macOS
        run: flutter build macos --release
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: DepthVibe-Apple-builds
          path: |
            build/macos/Build/Products/Release/DepthVibe.app
            build/ios/iphoneos/Runner.app
          if-no-files-found: warn
